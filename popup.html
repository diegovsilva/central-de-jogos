<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Central de Jogos</title>
  <link rel="stylesheet" href="popup.css" />
  <script src="vendor/qrcode.js"></script>
</head>
<body>
  <header class="topo">
    <h1 class="topo__titulo">Central de <span>Jogos</span></h1>
    <button id="apoiar-toggle" class="botao-apoiar" type="button" aria-expanded="false" aria-controls="apoiar-painel">
      ☕ Apoiar
    </button>
  </header>

  <section class="meu-time">
    <div class="meu-time__cabecalho">
      <label for="time-favorito-select">⭐ Meu time</label>
      <select id="time-favorito-select">
        <option value="">Escolher...</option>
      </select>
    </div>
    <div id="meu-time-jogo"></div>
  </section>

  <section id="apoiar-painel" class="apoiar" hidden>
    <p class="apoiar__texto">Curtindo o app? Ajuda a manter no ar 💚</p>

    <div id="apoiar-valores" class="apoiar__valores" role="radiogroup" aria-label="Valor da doação"></div>

    <div class="apoiar__livre">
      <span>R$</span>
      <input
        id="apoiar-valor-livre"
        type="number"
        min="1"
        step="1"
        inputmode="decimal"
        placeholder="Doe qualquer valor"
      />
    </div>

    <div class="apoiar__pix">
      <div id="apoiar-qr" class="apoiar__qr" aria-hidden="true"></div>
      <p class="apoiar__legenda">Escaneie com o app do seu banco ou copie o código Pix</p>
      <button id="apoiar-copiar" class="apoiar__copiar" type="button">Copiar código Pix</button>
    </div>
  </section>

  <main id="conteudo">
    <p id="status">Carregando…</p>
    <p class="dica">Toque no sino pra ser notificado só daquele jogo.</p>
    <div id="lista"></div>
  </main>

  <footer class="rodape">
    <a id="abrir-site" href="#" target="_blank" rel="noopener noreferrer">Abrir site completo →</a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
